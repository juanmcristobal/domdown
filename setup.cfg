[bumpversion]
current_version = 0.3.2
commit = True
tag = True

[bumpversion:file:setup.cfg]
search = current_version = {current_version}
replace = current_version = {new_version}

[bumpversion:file:setup.py]
search = version='{current_version}'
replace = version='{new_version}'

[bumpversion:file:domdown/_version.py]
search = DOMDOWN_VERSION = "{current_version}"
replace = DOMDOWN_VERSION = "{new_version}"

[bumpversion:file:README.md]
search = {current_version}
replace = {new_version}

[bumpversion:file:tests/frontmatter/test_frontmatter.py]
search = {current_version}
replace = {new_version}

[bumpversion:file:tests/pipeline/test_stages.py]
search = {current_version}
replace = {new_version}

[bumpversion:glob:tests/real/raw/*.md]
search = {current_version}
replace = {new_version}

[flake8]
ignore = E203, E266, E501, W503, F403, F401, W191, E101, F402, F841
exclude = docs
max-line-length = 120
select = B,C,E,F,W,T4,B9
